name: ANANKE Public Milestone Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  milestone-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public documentation
        uses: actions/checkout@v4
      - name: Validate milestone statuses and evidence report structure
        run: python3 scripts/verify_public_milestones.py
