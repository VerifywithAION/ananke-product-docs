# ANANKE public presentation site — STATIC DOCUMENTATION ONLY.
# It does not build, test, import or deploy the private ANANKE engine.
# GitHub repository admin must first select Settings > Pages > Source: GitHub Actions.
name: Deploy ANANKE public site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public documentation
        uses: actions/checkout@v4

      - name: Assemble static-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/site.css assets/site.js assets/ananke-mark.svg assets/ananke-brand.svg _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/site.css
          test -s _site/assets/site.js
          printf "Static site files:\n"
          find _site -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
